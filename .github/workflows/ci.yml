name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14.1-alpine
        env:
          POSTGRES_USER: postgres_test
          POSTGRES_PASSWORD: postgres_test
          POSTGRES_DB: postgres_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres_test -d postgres_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REAL_DATABASE_URL: postgresql+asyncpg://postgres_test:postgres_test@localhost:5433/postgres_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres_test:postgres_test@localhost:5433/postgres_test
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      SECRET_KEY: github-actions-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libpq-dev

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run tests
        run: pytest -q
