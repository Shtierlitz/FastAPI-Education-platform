version: "3.0"
services:
  db:
    container_name: "db"
    image: "postgres:14.1-alpine"
    restart: always
    environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
    ports:
        - "5432:5432"
    networks:
        - custom

  FastApi_education_platform_app:
    container_name: "FastApi_education_platform_app"
    image: "fastapi_education_platform_app"
    environment:
      REAL_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
        - "8000:8000"
    networks:
      - custom
networks:
    custom:
        driver: bridge
